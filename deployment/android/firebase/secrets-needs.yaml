# deployment/android/firebase/secrets-needs.yaml
# Dual-mode schema (vault + manual) per AC79/AC92.
schema_version: "1.0"
target: android-firebase
dual_mode: true
required_for: [android-signing, android-firebase-distribute]

vault_aliases:
  # group-banking's OWN dedicated upload keystore + signing creds (RULE-SECRETS-PROJECT-OWNED-001).
  - alias: mifos-x-group-banking-upload-keystore
    canonical: "secrets/android/keystores/upload_keystore.keystore"
    required_for: ["build", "sign"]
    materialize:
      format: "file"
      via: "copy"
  - alias: mifos-x-group-banking-upload-keystore-storepass
    canonical: "secrets/live/android/keystores/upload_keystore.properties"
    required_for: ["sign"]
    materialize:
      format: "env"
      via: "export"
  - alias: mifos-x-group-banking-upload-keystore-keypass
    canonical: "secrets/live/android/keystores/upload_keystore.properties"
    required_for: ["sign"]
    materialize:
      format: "env"
      via: "export"
  - alias: mifos-x-firebase-service-account
    canonical: "secrets/android/firebase/firebaseAppDistributionServiceCredentialsFile.json"
    required_for: ["distribute"]
    materialize:
      format: "file"
      via: "copy"

manual_inputs:
  - canonical: "secrets/android/keystores/upload_keystore.keystore"
    source_hint: "Request from release-mgr or generate via deployment/_shared/scripts/keystore-manager.sh"
    placeholder: "<base64-keystore>"
    gha_secret_var: "ANDROID_RELEASE_KEYSTORE_B64"
  - canonical: "secrets/android/firebase/firebaseAppDistributionServiceCredentialsFile.json"
    source_hint: "Firebase Console → Project Settings → Service Accounts → Generate Key"
    placeholder: "<service-account-json>"
    gha_secret_var: "FIREBASE_SERVICE_ACCOUNT_JSON"
